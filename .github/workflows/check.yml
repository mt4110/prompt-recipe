name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run check:boundary
      - run: rustup run 1.99.1 cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: rustup run 1.99.1 cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: rustup run 1.99.1 cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: rustup run 1.99.1 cargo check --manifest-path src-tauri/Cargo.toml --locked
