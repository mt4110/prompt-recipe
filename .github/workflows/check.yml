name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:discovery
      - run: npm run check:boundary
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
